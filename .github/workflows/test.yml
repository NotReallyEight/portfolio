name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Restore Git repository cache
        uses: actions/cache@v4
        with:
          path: .git
          key: git-cache-${{ github.ref_name }}
          restore-keys: |
            git-cache-main
            git-cache-
      - uses: actions/checkout@v4
      - name: Tests with Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run prettier
      - run: npm run build
